<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Permitter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="summary-bar" id="summary-bar">
    <span class="summary-item"><span class="summary-count critical-count" id="critical-count">0</span> Critical</span>
    <span class="summary-item"><span class="summary-count warning-count" id="warning-count">0</span> Warning</span>
    <span class="summary-item"><span class="summary-count safe-count" id="safe-count">0</span> Safe</span>
  </div>
  
  <div class="controls">
    <input type="text" class="search-input" id="search-input" placeholder="Search extensions...">
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn critical" data-filter="Critical">Critical</button>
      <button class="filter-btn warning" data-filter="Warning">Warning</button>
      <button class="filter-btn safe" data-filter="Safe">Safe</button>
    </div>
  </div>
  
  <div class="extension-list" id="extension-list"></div>
  
  <script src="popup.js"></script>
</body>
</html>
